<style>
  :root {
    --bga: #ebeae3;
    --bg: #f4f4f4;
    --fg: #111111;
    --muted: #9a9a96;
    --link: #111111;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0e0c;
      --fg: #ebeae3;
      --muted: #5a5a56;
      --link: #ebeae3;
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    font-weight: 400;
    font-size: 14px;
    letter-spacing: 0.02em;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    height: 100%;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    height: 100dvh;
    padding: 40px 24px;
  }

  main {
    width: 100%;
    max-width: 640px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  td {
    vertical-align: top;
    padding: 18px 0;
    text-transform: uppercase;
    line-height: 1.7;
  }

  td:first-child {
    width: 45%;
    padding-right: 24px;
    text-align: right;
  }

  td:last-child {
    width: 55%;
    padding-left: 24px;
  }

  a {
    color: var(--link);
    text-decoration: none;
    display: block;
    transition: opacity 0.15s ease;
  }

  a:hover {
    opacity: 0.5;
  }

  .disabled {
    color: var(--muted);
    pointer-events: none;
    cursor: default;
  }

  .name {
    font-weight: 800;
  }

  .clock {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 22px;
    overflow: hidden;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    white-space: nowrap;
    pointer-events: none;
  }

  .ticker {
    display: inline-block;
    /* The bar scrolls as a treadmill: JS translates the track left every frame
       and recycles each item from the front to the back the instant it clears
       the screen (see renderClock). Because the recycle subtracts the recycled
       item's width from the offset in the same frame, the visible content never
       moves at the seam — there is no end to snap back from, so no flicker.
       white-space: pre keeps the inter-item spacing exact so widths measure
       consistently. */
    white-space: pre;
    will-change: transform;
  }

  /* The city Manuel is currently in stands out against the muted ticker:
     brighter in dark mode, darker in light mode. */
  .clock .current {
    color: var(--fg);
    font-weight: 800;
  }

  .about-copy {
    max-width: 31ch;
  }

  @media (max-width: 520px) {
    body {
      padding: 32px 20px;
    }
    html, body {
      font-size: 13px;
    }
    td:first-child {
      padding-right: 16px;
    }
    td:last-child {
      padding-left: 16px;
    }
    .clock {
      font-size: 11px;
      bottom: 16px;
      letter-spacing: 0.1em;
    }
  }
</style>
</head>
<body>

  </main>
  <footer class="clock" aria-hidden="true"></footer>
  <script>
    const translations = {
      de: {
        metaDescription: "Manuel J. Asbeck ist Entwickler und Unternehmer und verwandelt Ideen in nützliche Software. Gründer und CEO von Flits.",
        role: "Gründer & CEO, Flits",
        stealth: "Mitgründer, Stealth",
        aboutLabel: "Über",
        aboutLead: "Entwickler und Unternehmer",
        aboutTail: "mit Fokus auf nützliche Software.",
        holdingsLabel: "Beteiligungen",
        pressLabel: "Presse",
        contactLabel: "Kontakt"
      }
    };

    const browserLanguages = navigator.languages || [navigator.language || navigator.userLanguage || "en"];
    const selectedLanguage = browserLanguages
      .map((language) => language.toLowerCase().split("-")[0])
      .find((language) => language === "de" || language === "en");

    if (selectedLanguage === "de") {
      document.documentElement.lang = "de";
      document
        .querySelector('meta[name="description"]')
        .setAttribute("content", translations.de.metaDescription);
      document.querySelectorAll("[data-i18n]").forEach((element) => {
        element.textContent = translations.de[element.dataset.i18n];
      });
    }

    // The contact address is deliberately absent from the static HTML — no
    // mailto:, no user@domain anywhere a harvester's regex could match. The
    // href is assembled from these parts the first time a human interacts
    // with the link (hover, keyboard focus, touch, or click), interactions
    // even JS-executing scrapers don't simulate.
    const emailParts = ["manuel", "flits.cc"];
    const emailLink = document.getElementById("email-link");
    function armEmailLink() {
      emailLink.href = "mailto:" + emailParts.join(String.fromCharCode(64));
    }
    ["pointerenter", "focus", "touchstart", "click"].forEach((type) => {
      emailLink.addEventListener(type, armEmailLink);
    });

    const zones = [
      { code: "MUC", tz: "Europe/Berlin" },
      { code: "LON", tz: "Europe/London" },
      { code: "SEA", tz: "America/Los_Angeles" },
      { code: "LCA", tz: "Asia/Nicosia" },
      { code: "DXB", tz: "Asia/Dubai" },
      { code: "TYO", tz: "Asia/Tokyo" }
    ];

    const clock = document.querySelector(".clock");

    function timeIn(timeZone) {
      return new Intl.DateTimeFormat("en-GB", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false,
        timeZone
      }).format(new Date());
    }

    const track = document.createElement("div");
    track.className = "ticker";
    clock.append(track);

    // Manuel's current location — the subject of the site, shown the same to
    // every visitor (NOT the visitor's own zone). Published value comes from
    // /api/location; falls back to this default until the backend is set up.
    // The matching city in the ticker below is highlighted; if the current
    // zone isn't one of the listed cities, it's added so it can still show.
    const DEFAULT_ZONE = "Asia/Tokyo";
    let homeZone = DEFAULT_ZONE;

    function isValidZone(tz) {
      if (typeof tz !== "string" || !tz) return false;
      try {
        new Intl.DateTimeFormat("en-GB", { timeZone: tz });
        return true;
      } catch {
        return false;
      }
    }

    // Airport codes for zones that may turn up as the home zone but aren't in
    // the listed cities above. Falls back to deriving from the IANA zone name
    // (uppercased city) when there's no mapping.
    const ZONE_CODES = {
      "Europe/Berlin": "MUC",
      "Europe/London": "LON",
      "America/Los_Angeles": "SEA",
      "Asia/Nicosia": "LCA",
      "Asia/Dubai": "DXB",
      "Asia/Tokyo": "TYO"
    };

    function cityFromZone(tz) {
      return ZONE_CODES[tz] || tz.split("/").pop().replace(/_/g, " ").toUpperCase();
    }

    // The ticker scrolls as a continuous treadmill rather than a looping CSS
    // animation. The old approach slid two copies left by one copy width and
    // snapped the transform back to 0 on every cycle; any sub-pixel mismatch at
    // that snap showed up as a flicker. Here there is no snap: a single chain of
    // items is translated left each frame, and the moment an item's right edge
    // clears the left of the screen it is moved to the end of the chain and its
    // width is subtracted from the offset in the SAME frame. The removal shifts
    // everything left by that width while the smaller offset shifts everything
    // right by the same width, so the visible content never jumps — the bar
    // runs forever with no seam to flicker at.
    const SECONDS_PER_PASS = 36;
    let clockSignature = null;
    // Each item: { el, timeEl, tz, w } — el is the scrolling unit (city + time
    // + separator), timeEl is the node whose text we rewrite each second, w is
    // its cached pixel width used to decide when it has scrolled off-screen.
    let items = [];
    let offset = 0;          // px the track is currently shifted left
    let pxPerSecond = 0;     // scroll speed, derived from one pass width
    let rafId = null;
    let lastTs = null;
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    // Build one scrolling unit for a zone, returning a handle for time updates.
    function makeItem(zone) {
      const el = document.createElement("span");
      const cell = document.createElement("span");
      if (zone.tz === homeZone) cell.className = "current";
      const time = document.createElement("span");
      time.textContent = timeIn(zone.tz);
      cell.append(zone.code + " ", time);
      el.append(cell, document.createTextNode(" — "));
      return { el, timeEl: time, tz: zone.tz, w: 0 };
    }

    // Lay down enough repeats of the list that the chain is at least one full
    // screen wider than the viewport. The extra screen of buffer means there is
    // always content queued to the right as items recycle off the left, so the
    // treadmill can never run dry and reveal a gap.
    function buildTrack(list) {
      track.textContent = "";
      items = [];
      list.forEach((zone) => {
        const item = makeItem(zone);
        items.push(item);
        track.append(item.el);
      });
      const onePassW = track.getBoundingClientRect().width;
      const target = clock.clientWidth + onePassW;
      let totalW = onePassW;
      while (onePassW > 0 && totalW < target) {
        list.forEach((zone) => {
          const item = makeItem(zone);
          items.push(item);
          track.append(item.el);
        });
        totalW += onePassW;
      }
      // Keep the same on-screen speed as the old 36s-per-pass animation.
      pxPerSecond = onePassW > 0 ? onePassW / SECONDS_PER_PASS : 0;
      items.forEach((item) => { item.w = item.el.getBoundingClientRect().width; });
      offset = 0;
      track.style.transform = "translateX(0)";
    }

    function frame(ts) {
      if (lastTs === null) lastTs = ts;
      offset += pxPerSecond * (ts - lastTs) / 1000;
      lastTs = ts;
      // Recycle every item that has fully scrolled past the left edge. Moving it
      // to the end and subtracting its width keeps the visible content fixed, so
      // the offset stays small and bounded instead of growing without limit.
      while (items.length && items[0].w > 0 && items[0].w <= offset) {
        const first = items.shift();
        offset -= first.w;
        track.append(first.el);
        items.push(first);
      }
      track.style.transform = "translateX(" + (-offset) + "px)";
      rafId = requestAnimationFrame(frame);
    }

    function startAnimation() {
      if (rafId !== null) cancelAnimationFrame(rafId);
      rafId = null;
      lastTs = null;
      if (reduceMotion.matches) {
        offset = 0;
        track.style.transform = "translateX(0)";
        return;
      }
      rafId = requestAnimationFrame(frame);
    }

    function renderClock() {
      // Ensure the current home zone is represented even if it isn't one of the
      // six listed cities, so wherever Manuel is can always be highlighted.
      const list = zones.some((zone) => zone.tz === homeZone)
        ? zones
        : [{ code: cityFromZone(homeZone), tz: homeZone }, ...zones];
      const signature =
        list.map((zone) => zone.tz).join("|") + "@" + homeZone + "@" + clock.clientWidth;
      if (signature !== clockSignature) {
        buildTrack(list);
        clockSignature = signature;
        startAnimation();
      }
      // Each item carries its own zone, so updating in place needs no indexing.
      items.forEach((item) => {
        const time = timeIn(item.tz);
        if (item.timeEl.textContent !== time) item.timeEl.textContent = time;
      });
    }

    // The viewport width and the (async) web font both change item widths;
    // rebuild when either settles so the buffer still covers the bar.
    window.addEventListener("resize", renderClock);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        clockSignature = null;
        renderClock();
      });
    }
    if (reduceMotion.addEventListener) {
      reduceMotion.addEventListener("change", startAnimation);
    }

    renderClock();
    // Tick every second so the seconds visibly advance. The cells are updated
    // in place (text only, never rebuilt) and the font is monospace, so the
    // digits change without reflowing the bar or disturbing the animation.
    setInterval(renderClock, 1000);

    // Sync the published location, then — if this is Manuel's own device —
    // publish wherever he is now. Order matters: read the stored zone FIRST so
    // the owner-publish compares against the stored value. Otherwise it would
    // compare against the default and skip updating when he returns home, and a
    // late GET could overwrite his real location with a stale stored one.
    async function syncLocation() {
      try {
        const res = await fetch("/api/location");
        if (res.ok) {
          const data = await res.json();
          if (data && isValidZone(data.timeZone)) {
            homeZone = data.timeZone;
            renderClock();
          }
        }
      } catch (e) {}

      // Owner device (token stored once via /set.html?token=…) republishes its
      // current zone whenever it differs from the stored one — so both
      // traveling and returning home update the site with no editing.
      const ownerToken = localStorage.getItem("ownerToken");
      if (!ownerToken) return;
      const deviceZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
      if (!isValidZone(deviceZone) || deviceZone === homeZone) return;
      try {
        const res = await fetch("/api/location", {
          method: "POST",
          headers: { "content-type": "application/json", "x-set-secret": ownerToken },
          body: JSON.stringify({ timeZone: deviceZone })
        });
        if (res.ok) {
          homeZone = deviceZone;
          renderClock();
        }
      } catch (e) {}
    }

    syncLocation();

    // Register the service worker so the home-screen app works offline.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
