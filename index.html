<style>
  :root {
    --bga: #ebeae3;
    --bg: #f4f4f4;
    --fg: #111111;
    --muted: #9a9a96;
    --link: #111111;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0e0c;
      --fg: #ebeae3;
      --muted: #5a5a56;
      --link: #ebeae3;
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    font-weight: 400;
    font-size: 14px;
    letter-spacing: 0.02em;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    height: 100%;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    height: 100dvh;
    padding: 40px 24px;
  }

  main {
    width: 100%;
    max-width: 640px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  td {
    vertical-align: top;
    padding: 18px 0;
    text-transform: uppercase;
    line-height: 1.7;
  }

  td:first-child {
    width: 45%;
    padding-right: 24px;
    text-align: right;
  }

  td:last-child {
    width: 55%;
    padding-left: 24px;
  }

  a {
    color: var(--link);
    text-decoration: none;
    display: block;
    transition: opacity 0.15s ease;
  }

  a:hover {
    opacity: 0.5;
  }

  .disabled {
    color: var(--muted);
    pointer-events: none;
    cursor: default;
  }

  .name {
    font-weight: 800;
  }

  .clock {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 22px;
    overflow: hidden;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    white-space: nowrap;
    pointer-events: none;
  }

  .ticker {
    display: inline-block;
    /* Two identical copies sit side by side and the track slides left by
       exactly one copy (translateX(-50%)) before snapping back, so the loop is
       seamless. That only holds if both copies render the SAME width, which
       requires white-space: pre — under the inherited "nowrap" the trailing
       whitespace of the second copy is trimmed at the line end, making it
       narrower than the first and leaving the -50% point just short of the
       seam, which shows up as a jump on every rotation. */
    white-space: pre;
    animation: ticker 36s linear infinite;
  }

  /* The city Manuel is currently in stands out against the muted ticker:
     brighter in dark mode, darker in light mode. */
  .clock .current {
    color: var(--fg);
    font-weight: 800;
  }

  @keyframes ticker {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  @media (prefers-reduced-motion: reduce) {
    .ticker { animation: none; }
  }

  .about-copy {
    max-width: 31ch;
  }

  @media (max-width: 520px) {
    body {
      padding: 32px 20px;
    }
    html, body {
      font-size: 13px;
    }
    td:first-child {
      padding-right: 16px;
    }
    td:last-child {
      padding-left: 16px;
    }
    .clock {
      font-size: 11px;
      bottom: 16px;
      letter-spacing: 0.1em;
    }
  }
</style>
</head>
<body>

  </main>
  <footer class="clock" aria-hidden="true"></footer>
  <script>
    const translations = {
      de: {
        metaDescription: "Manuel J. Asbeck ist Entwickler und Unternehmer und verwandelt Ideen in nützliche Software. Gründer und CEO von Flits.",
        role: "Gründer & CEO, Flits",
        stealth: "Mitgründer, Stealth",
        aboutLabel: "Über",
        aboutLead: "Entwickler und Unternehmer",
        aboutTail: "mit Fokus auf nützliche Software.",
        holdingsLabel: "Beteiligungen",
        pressLabel: "Presse",
        contactLabel: "Kontakt"
      }
    };

    const browserLanguages = navigator.languages || [navigator.language || navigator.userLanguage || "en"];
    const selectedLanguage = browserLanguages
      .map((language) => language.toLowerCase().split("-")[0])
      .find((language) => language === "de" || language === "en");

    if (selectedLanguage === "de") {
      document.documentElement.lang = "de";
      document
        .querySelector('meta[name="description"]')
        .setAttribute("content", translations.de.metaDescription);
      document.querySelectorAll("[data-i18n]").forEach((element) => {
        element.textContent = translations.de[element.dataset.i18n];
      });
    }

    const zones = [
      { code: "MUNICH", tz: "Europe/Berlin" },
      { code: "LONDON", tz: "Europe/London" },
      { code: "SEATTLE", tz: "America/Los_Angeles" },
      { code: "CYPRUS", tz: "Asia/Nicosia" },
      { code: "DUBAI", tz: "Asia/Dubai" },
      { code: "TOKYO", tz: "Asia/Tokyo" }
    ];

    const clock = document.querySelector(".clock");

    function timeIn(timeZone) {
      return new Intl.DateTimeFormat("en-GB", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false,
        timeZone
      }).format(new Date());
    }

    const track = document.createElement("div");
    track.className = "ticker";
    const copyA = document.createElement("span");
    const copyB = document.createElement("span");
    track.append(copyA, copyB);
    clock.append(track);

    // Manuel's current location — the subject of the site, shown the same to
    // every visitor (NOT the visitor's own zone). Published value comes from
    // /api/location; falls back to this default until the backend is set up.
    // The matching city in the ticker below is highlighted; if the current
    // zone isn't one of the listed cities, it's added so it can still show.
    const DEFAULT_ZONE = "Asia/Tokyo";
    let homeZone = DEFAULT_ZONE;

    function isValidZone(tz) {
      if (typeof tz !== "string" || !tz) return false;
      try {
        new Intl.DateTimeFormat("en-GB", { timeZone: tz });
        return true;
      } catch {
        return false;
      }
    }

    function cityFromZone(tz) {
      return tz.split("/").pop().replace(/_/g, " ").toUpperCase();
    }

    // The ticker animates continuously, so the DOM must stay stable: tearing it
    // down and rebuilding innerHTML on every tick makes the bar flash/disappear.
    // We build the nodes once (keeping a handle on each time cell) and only
    // rewrite the time text in place, rebuilding solely when the inputs that
    // affect layout change (the zone list, the home zone, or the viewport
    // width) — never on a plain time tick.
    const SECONDS_PER_PASS = 36;
    let clockSignature = null;
    let currentList = [];
    let timeCellsA = [];
    let timeCellsB = [];

    // Append the list once to a copy, returning a handle on each time cell.
    function appendPass(list, copy) {
      const cells = [];
      list.forEach((zone) => {
        const cell = document.createElement("span");
        if (zone.tz === homeZone) cell.className = "current";
        const time = document.createElement("span");
        time.textContent = timeIn(zone.tz);
        cell.append(zone.code + " ", time);
        copy.append(cell, document.createTextNode(" — "));
        cells.push(time);
      });
      return cells;
    }

    // The track is two identical copies sliding left by exactly one copy
    // (translateX(-50%)) before snapping back. That is only gap-free if a
    // single copy is at least as wide as the visible bar — otherwise its
    // trailing edge clears the screen at the -50% mark and the bar blanks for a
    // frame before the loop restarts. So we repeat the list enough times that
    // one copy fills the viewport, then scale the duration by that repeat count
    // to keep the scroll speed constant regardless of how many passes it took.
    function buildTracks(list) {
      copyA.textContent = "";
      const probe = appendPass(list, copyA);
      const onePassW = copyA.getBoundingClientRect().width;
      const reps = onePassW > 0
        ? Math.max(1, Math.ceil(clock.clientWidth / onePassW))
        : 1;

      let cellsA = probe;
      let cellsB = [];
      copyB.textContent = "";
      cellsB = cellsB.concat(appendPass(list, copyB));
      for (let r = 1; r < reps; r++) {
        cellsA = cellsA.concat(appendPass(list, copyA));
        cellsB = cellsB.concat(appendPass(list, copyB));
      }

      track.style.animationDuration = reps * SECONDS_PER_PASS + "s";
      return { cellsA, cellsB };
    }

    function renderClock() {
      // Ensure the current home zone is represented even if it isn't one of the
      // six listed cities, so wherever Manuel is can always be highlighted.
      const list = zones.some((zone) => zone.tz === homeZone)
        ? zones
        : [{ code: cityFromZone(homeZone), tz: homeZone }, ...zones];
      const signature =
        list.map((zone) => zone.tz).join("|") + "@" + homeZone + "@" + clock.clientWidth;
      if (signature !== clockSignature) {
        const built = buildTracks(list);
        timeCellsA = built.cellsA;
        timeCellsB = built.cellsB;
        currentList = list;
        clockSignature = signature;
      }
      // Cells repeat the list, so map each one back to its zone by its position.
      for (let i = 0; i < timeCellsA.length; i++) {
        const time = timeIn(currentList[i % currentList.length].tz);
        if (timeCellsA[i].textContent !== time) timeCellsA[i].textContent = time;
        if (timeCellsB[i].textContent !== time) timeCellsB[i].textContent = time;
      }
    }

    // The viewport width and the (async) web font both change how many passes
    // are needed; rebuild when either settles so a copy always covers the bar.
    window.addEventListener("resize", renderClock);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        clockSignature = null;
        renderClock();
      });
    }

    renderClock();
    // Tick every second so the seconds visibly advance. The cells are updated
    // in place (text only, never rebuilt) and the font is monospace, so the
    // digits change without reflowing the bar or disturbing the animation.
    setInterval(renderClock, 1000);

    // Sync the published location, then — if this is Manuel's own device —
    // publish wherever he is now. Order matters: read the stored zone FIRST so
    // the owner-publish compares against the stored value. Otherwise it would
    // compare against the default and skip updating when he returns home, and a
    // late GET could overwrite his real location with a stale stored one.
    async function syncLocation() {
      try {
        const res = await fetch("/api/location");
        if (res.ok) {
          const data = await res.json();
          if (data && isValidZone(data.timeZone)) {
            homeZone = data.timeZone;
            renderClock();
          }
        }
      } catch (e) {}

      // Owner device (token stored once via /set.html?token=…) republishes its
      // current zone whenever it differs from the stored one — so both
      // traveling and returning home update the site with no editing.
      const ownerToken = localStorage.getItem("ownerToken");
      if (!ownerToken) return;
      const deviceZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
      if (!isValidZone(deviceZone) || deviceZone === homeZone) return;
      try {
        const res = await fetch("/api/location", {
          method: "POST",
          headers: { "content-type": "application/json", "x-set-secret": ownerToken },
          body: JSON.stringify({ timeZone: deviceZone })
        });
        if (res.ok) {
          homeZone = deviceZone;
          renderClock();
        }
      } catch (e) {}
    }

    syncLocation();

    // Register the service worker so the home-screen app works offline.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
